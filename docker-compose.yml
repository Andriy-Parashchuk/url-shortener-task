services:
  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis

    ports:
      - "6379:6379"

  api:
    build:
      context: ./api

    container_name: api

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - ./api:/app

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    environment:
      DB_NAME: shortener
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

  worker:
    build:
      context: ./worker

    container_name: worker

    volumes:
      - ./worker:/app

    depends_on:
      - redis

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  postgres_data: